name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Manifest + package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest and referenced assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content manifest.json -Raw | ConvertFrom-Json
          if (@(2, 3) -notcontains $m.manifest_version) { throw "manifest_version must be 2 or 3" }
          if ([string]::IsNullOrWhiteSpace([string]$m.name)) { throw "manifest.json name is required" }
          if (([string]$m.version) -notmatch '^\d+\.\d+\.\d+$') { throw "manifest.json version must be X.Y.Z (got '$($m.version)')" }
          $refs = New-Object System.Collections.Generic.List[string]
          if ($m.background.service_worker) { $refs.Add([string]$m.background.service_worker) }
          foreach ($s in @($m.background.scripts)) { if ($s) { $refs.Add([string]$s) } }
          foreach ($b in @($m.content_scripts)) {
            if (-not $b) { continue }
            foreach ($a in @($b.js) + @($b.css)) { if ($a) { $refs.Add([string]$a) } }
          }
          if ($m.action.default_popup) { $refs.Add([string]$m.action.default_popup) }
          if ($m.options_page) { $refs.Add([string]$m.options_page) }
          if ($m.options_ui.page) { $refs.Add([string]$m.options_ui.page) }
          if ($m.icons) { foreach ($p in $m.icons.PSObject.Properties) { if ($p.Value) { $refs.Add([string]$p.Value) } } }
          foreach ($e in @($m.web_accessible_resources)) {
            if (-not $e) { continue }
            $c = if ($e -is [string]) { @($e) } else { @($e.resources) }
            foreach ($r in $c) {
              if (-not $r) { continue }
              $r = [string]$r
              if ($r -match '[*?]' -or $r -match '^(https?:)?//') { continue }
              $refs.Add($r)
            }
          }
          $missing = @()
          foreach ($r in ($refs | Select-Object -Unique)) {
            $rel = ($r -replace '^[\\/]+', '') -replace '/', '\'
            if (-not (Test-Path -LiteralPath $rel)) { $missing += $r }
          }
          if ($missing.Count -gt 0) { throw "missing manifest assets: $($missing -join ', ')" }
          "manifest ok: v$($m.version) ($($refs.Count) asset refs)"

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $version = [string]((Get-Content manifest.json -Raw | ConvertFrom-Json).version)
          if ($tag -ne $version) { throw "tag v$tag does not match manifest.json version $version" }

      - name: Build Web Store zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $stage = Join-Path $root '.ci-dist'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          $files = Get-ChildItem -Recurse -File | Where-Object {
            $rel = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
            if ($rel -match '^(\.git|\.github|\.opencode|\.cline|tests)/') { return $false }
            if ($rel -match '^(\.ci-dist/|extension-.*\.zip$)') { return $false }
            if ($rel -match '\.md$' -and $rel -ne 'PRIVACY.md') { return $false }
            return $true
          }
          foreach ($file in $files) {
            $rel = $file.FullName.Substring($root.Length + 1)
            $dest = Join-Path $stage $rel
            $dir = Split-Path $dest -Parent
            if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
            Copy-Item -LiteralPath $file.FullName -Destination $dest
          }
          $version = [string]((Get-Content manifest.json -Raw | ConvertFrom-Json).version)
          $zip = "extension-v$version.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          "built $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: web-store-zip
          path: extension-*.zip

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: extension-*.zip
          generate_release_notes: true
